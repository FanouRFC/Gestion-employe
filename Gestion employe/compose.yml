services:
  front:
    build: ./front
    ports:
      - "5173:5173"
    environment:
      - VITE_POSTGRES_HOST=database

  back:
    build: ./back
    ports:
      - "9000:9000"
    env_file:
      - ./back/.env
    environment:
      - POSTGRES_HOST=database
    depends_on:
      - database

  database:
    image: postgres:15-alpine
    env_file:
      - ./back/.env
    volumes:
      - enseignantdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  enseignantdb:
